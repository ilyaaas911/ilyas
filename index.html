<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday FATI ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #19102b, #050509 75%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    position: relative;
    z-index: 10;
}

.cake {
    font-size: 75px;
    animation: float 2s ease-in-out infinite;
}

h1 {
    font-size: 36px;
    margin: 10px 0;
    animation: glow 1.5s infinite alternate;
}

h2 {
    font-size: 60px;
    margin: 10px 0;
    color: #ff6fa5;
    animation: heartBeat 1.2s infinite;
}

.message {
    font-size: 19px;
    opacity: 0.9;
}

@keyframes glow {
    from {
        text-shadow: 0 0 5px white;
    }
    to {
        text-shadow:
            0 0 10px #ff6fa5,
            0 0 25px #ff6fa5,
            0 0 45px #ff6fa5;
    }
}

@keyframes heartBeat {
    50% {
        transform: scale(1.12);
    }
}

@keyframes float {
    50% {
        transform: translateY(-10px);
    }
}

.star {
    position: absolute;
    top: -50px;
    animation: fall linear infinite;
    pointer-events: none;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="cake">🎂</div>

    <h1>✨ HAPPY BIRTHDAY ✨</h1>

    <h2>FATI ❤️</h2>

    <div class="message">
        🎉 Wishing you a magical day 🎉
        <br>
        ⭐ You deserve all the happiness ⭐
    </div>

</div>

<script>

const symbols = [
    "⭐",
    "✨",
    "💫",
    "❤️",
    "🌟",
    "🎈"
];

for (let i = 0; i < 60; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.innerHTML =
        symbols[Math.floor(Math.random() * symbols.length)];

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.fontSize =
        (10 + Math.random() * 25) + "px";

    star.style.animationDuration =
        (3 + Math.random() * 5) + "s";

    star.style.animationDelay =
        Math.random() * 6 + "s";

    document.body.appendChild(star);
}

</script>

</body>
</html>
