<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Rabab 🤍</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% 30%, #28152f 0%, #0b0710 55%, #020204 100%);
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

/* ⭐ النجوم */

.star {
    position: fixed;
    top: -30px;
    color: white;
    pointer-events: none;
    z-index: 1;
    animation: fall linear infinite;
}

@keyframes fall {

    0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}


/* 🌌 المقدمة */

#intro {

    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 20;

    background:
        radial-gradient(circle at center, #24152d, #050509 75%);

    transition: 1.5s;
}


.intro-box {

    padding: 30px;

    animation: appear 2s ease;
}


.small {

    font-size: 15px;

    letter-spacing: 3px;

    opacity: .65;
}


.intro-title {

    font-size: 48px;

    margin: 20px 0;

    font-style: italic;

    color: #ffabc6;

    text-shadow:
        0 0 10px #ff719f,
        0 0 30px #ff719f;
}


.intro-heart {

    font-size: 65px;

    animation: beat 1.2s infinite;
}


.open-btn {

    margin-top: 30px;

    padding: 14px 35px;

    border: 1px solid #ff9cbb;

    border-radius: 30px;

    background: transparent;

    color: white;

    font-size: 16px;

    letter-spacing: 2px;

    cursor: pointer;

    transition: .4s;
}


.open-btn:hover {

    background: #ff719f;

    box-shadow: 0 0 30px #ff719f;

    transform: scale(1.07);
}


/* 💌 الرسالة */

#message {

    display: none;

    min-height: 100vh;

    padding: 35px 18px;

    justify-content: center;

    align-items: center;

    text-align: center;

    position: relative;

    z-index: 10;
}


.card {

    width: 100%;

    max-width: 650px;

    padding: 35px 25px;

    border: 1px solid rgba(255,255,255,.18);

    border-radius: 25px;

    background: rgba(13,9,18,.78);

    box-shadow:

        0 0 40px rgba(255,100,160,.15),

        inset 0 0 30px rgba(255,255,255,.03);

    backdrop-filter: blur(12px);

    animation: cardAppear 1.8s ease;
}


.hello {

    font-size: 15px;

    letter-spacing: 2px;

    opacity: .6;

    margin-bottom: 10px;
}


.name {

    font-size: 55px;

    margin: 5px 0 20px;

    color: #ff9fbe;

    font-style: italic;

    text-shadow:

        0 0 10px #ff719f,

        0 0 30px rgba(255,111,159,.5);

    animation: beat 2s infinite;
}


.line {

    width: 80px;

    height: 1px;

    background: #ff9fbe;

    margin: 20px auto 30px;
}


.message-text {

    font-size: 18px;

    line-height: 2;

    color: #f4edf2;

    min-height: 300px;

    text-align: center;
}


.cursor {

    display: inline-block;

    width: 2px;

    height: 20px;

    background: #ff9fbe;

    animation: blink .7s infinite;

    vertical-align: middle;
}


.signature {

    margin-top: 30px;

    font-size: 18px;

    font-style: italic;

    color: #ffb0c9;

    opacity: 0;

    transition: 2s;
}


.final-heart {

    font-size: 35px;

    margin-top: 15px;

    opacity: 0;

    transition: 2s;

    animation: beat 1.2s infinite;
}


/* ✨ Animations */

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes cardAppear {

    from {
        opacity: 0;
        transform: scale(.85) translateY(30px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}


@keyframes beat {

    50% {
        transform: scale(1.12);
    }
}


@keyframes blink {

    50% {
        opacity: 0;
    }
}

</style>

</head>


<body>


<!-- 🌌 المقدمة -->

<div id="intro">

    <div class="intro-box">

        <div class="small">
            شي حاجة صغيرة ليك...
        </div>

        <div class="intro-title">
            Rabab
        </div>

        <div class="intro-heart">
            ♡
        </div>

        <button class="open-btn" onclick="openMessage()">
            OPEN ♡
        </button>

    </div>

</div>



<!-- 💌 الرسالة -->

<div id="message">

    <div class="card">

        <div class="hello">
            رسالة صغيرة من القلب...
        </div>

        <div class="name">
            Rabab 🤍
        </div>

        <div class="line"></div>

        <div class="message-text">

            <span id="typing"></span><span class="cursor"></span>

        </div>


        <div class="signature" id="signature">

            ديما بخير 🤍<br>
            — Ilyas

        </div>


        <div class="final-heart" id="finalHeart">

            🤍

        </div>

    </div>

</div>



<script>


/* ⭐ النجوم والرموز */

const symbols = [

    "✦",
    "✧",
    "⋆",
    "✨",
    "♡",
    "⭐",
    "💫"

];


for (let i = 0; i < 70; i++) {

    let star = document.createElement("div");

    star.className = "star";

    star.innerHTML =
        symbols[Math.floor(Math.random() * symbols.length)];

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.fontSize =
        (8 + Math.random() * 22) + "px";

    star.style.animationDuration =
        (4 + Math.random() * 7) + "s";

    star.style.animationDelay =
        Math.random() * 7 + "s";

    document.body.appendChild(star);

}



/* 💌 الرسالة */

const text = `ما عرفت منين نبدا هاد الرسالة،
ولكن قلت نخلي ليك شي حاجة صغيرة تبقى عندك كذكرى زوينة. 🤍

بغيت غير نقول ليك بلي كنقدّر بزاف الصداقة ديالنا،
وكنشوفك بحال أخت عندي.

شكراً على الضحك، على الهضرة،
على المواقف الزوينة،
وحتى على داكشي البسيط اللي يمكن ما كيبانش مهم،
ولكن كيخلي الذكريات تبقى. ✨

نتمنى ليك من قلبي كل الخير،
وتبقى ديما بنفس الشخصية ديالك:
عفوية، قوية، ومميزة بطريقتك الخاصة.

ومهما دازت الأيام وتبدلات الظروف،
غادي نبقى ديما كنقدّر هاد الصداقة
والذكريات اللي بيناتنا.

كاينين ناس كيدوزو فحياتنا،
وكاينين ناس كيخليو فيها أثر زوين.

وأنتِ من الناس اللي كنتمنا ليهم
غير الخير والسعادة. 🤍`;



/* ✍️ Typing Effect */

function typeWriter() {

    const typing =
        document.getElementById("typing");

    let i = 0;


    function type() {

        if (i < text.length) {

            typing.innerHTML +=
                text.charAt(i)
                .replace(/\n/g, "<br>");

            i++;

            setTimeout(type, 35);

        } else {

            document.getElementById("signature")
                .style.opacity = "1";

            setTimeout(() => {

                document.getElementById("finalHeart")
                    .style.opacity = "1";

            }, 800);

        }

    }


    type();

}



/* ❤️ فتح الرسالة */

function openMessage() {

    const intro =
        document.getElementById("intro");

    const message =
        document.getElementById("message");


    intro.style.opacity = "0";


    setTimeout(() => {

        intro.style.display = "none";

        message.style.display = "flex";

        typeWriter();

    }, 1200);

}

</script>


</body>
</html>
